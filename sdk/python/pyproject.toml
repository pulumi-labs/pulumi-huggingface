[project]
  name = "pulumi_labs_huggingface"
  description = "Experimental: manage Hugging Face resources — Inference Endpoints, Spaces, and Hub repositories — as infrastructure with Pulumi."
  dependencies = ["parver>=0.2.1", "pulumi>=3.231.0,<4.0.0", "semver>=2.8.1", "typing-extensions>=4.11,<5; python_version < \"3.11\""]
  keywords = ["pulumi", "huggingface", "ai", "machine-learning", "category/cloud"]
  readme = "pulumi_labs_huggingface/README.md"
  requires-python = ">=3.9"
  version = "0.0.1+dev"
  license = "Apache-2.0"
  [project.urls]
    Homepage = "https://huggingface.co"
    Repository = "https://github.com/pulumi-labs/pulumi-huggingface"

[build-system]
  requires = ["setuptools>=61.0"]
  build-backend = "setuptools.build_meta"

[tool]
  [tool.setuptools]
    [tool.setuptools.package-data]
      pulumi_labs_huggingface = ["py.typed", "pulumi-plugin.json"]
