credentials:
  - name: HUGGINGFACE_TOKEN
    required: true
account: >-
  A Hugging Face Hub user account (a free account is enough) with a fine-grained or write
  access token that can create repos, spaces, collections, webhooks and buckets. Use a
  dedicated throwaway test user or namespace so cleanup cannot touch real repos. All test
  repositories and spaces must be created with private=true. Unverified: whether Bucket
  creation is enabled for free accounts (Storage Buckets may need a plan or beta access),
  and whether Space sleepTimeSeconds is accepted on cpu-basic hardware. No billing method
  is needed for the tested surface; leave none attached so paid hardware cannot be bought.
resources:
  - type: huggingface:index:Repository
    test: true
    update: gated
    cost: none
  - type: huggingface:index:Space
    test: true
    update: variables
    cost: none (cpu-basic hardware only, which is free; never set a paid hardware flavor)
  - type: huggingface:index:Collection
    test: true
    update: description
    cost: none
  - type: huggingface:index:CollectionItem
    test: true
    update: note
    cost: none
  - type: huggingface:index:RepositoryBranch
    test: true
    update: null
    cost: none
  - type: huggingface:index:RepositoryTag
    test: true
    update: null
    cost: none
  - type: huggingface:index:Webhook
    test: true
    update: disabled
    cost: none
  - type: huggingface:index:Bucket
    test: true
    update: null
    cost: none (keep the bucket empty; storage is only billed beyond the free quota)
  - type: huggingface:index:InferenceEndpoint
    test: false
    reason: Dedicated endpoints are billed per hour of compute (GPU/CPU instances) from creation until deletion and need a payment method on the account; cannot be run safely unattended on a free test account.
functions:
  - name: getWhoami
    test: true
  - name: getRepository
    test: true
  - name: getSpace
    test: true
  - name: getCollection
    test: true
  - name: getCollectionItem
    test: true
  - name: getRepositoryBranch
    test: true
  - name: getRepositoryTag
    test: true
  - name: getWebhook
    test: true
  - name: getBucket
    test: true
  - name: listInferenceEndpoints
    test: true
  - name: getInferenceEndpoint
    test: false
    reason: Needs an existing Inference Endpoint, which bills per hour and needs a payment method; the test account has none.
regressions:
  - "#1712 pulumi import of an ID that does not exist (Repository, Space, Bucket, Webhook, Collection, RepositoryBranch, RepositoryTag) exits non-zero with an error naming the ID and stores nothing; a dataset imported as namespace/name (no datasets/ prefix) fails the same way; pulumi refresh after deleting the object out of band still removes it from state"
  - "#1675 RepositoryTag created with a message (annotated tag) on main: its targetCommit (state and getRepositoryTag) equals the main branch targetCommit and is a commit listed by the Hub, not the tag object id"
  - "#1577 import then inspect the stack state (pulumi stack export --show-secrets off): every property the schema marks secret on an imported resource is a secret, never plaintext; a refresh of a resource created by the program keeps them secret"
  - "InferenceEndpoint: endpointType defaults to authenticated and protected is rejected at preview (protected was removed by the API)"
  - "Repository: changing private is applied through the settings API and refresh reverts drift (update used to be a no-op)"
  - "Repository: dataset repositories use the ID datasets/namespace/name and import by ID alone; models stay namespace/name"
  - "Space: variables and secrets are written one key per request and clearing the lists deletes the keys"
  - "Space: refresh reads hardware from runtime.hardware, so hardware drift is detected; invalid hardware names h100 and h100x8 are rejected at preview"
  - "#1549 Repository/Space: the resource ID and repoId/spaceId are namespace/name even though the Hub create response carries an ObjectId in id"
  - "#1552 Bucket: the name output is the resolved bucket name even when the name input is unset"
  - "#1550 an update preview that changes only a mutable input (Collection description, Repository/Space private) keeps slug, url, repoId and spaceId known instead of known after apply"
  - "#1551 Check accepts inputs that are unknown at preview (Space sdk, Webhook url/watched, RepositoryBranch/Tag repoId/ref, Collection title, CollectionItem fields) and still rejects literal malformed values"
  - "Space/Repository: changing sdk, namespace or repoType replaces the resource instead of planning a no-op update"
  - "Repository/Space/InferenceEndpoint: deleting a resource already deleted outside Pulumi is a no-op, not an error"
  - "huggingface:token config falls back to the HUGGINGFACE_TOKEN env var when unset; explicit config still wins"
  - "Examples and templates use the default provider with no per-resource token argument"
notes: >-
  Create every Repository and Space private. Resource names double as Hub names (replacements
  delete before creating), so use unique, run-scoped names to avoid collisions in a shared
  namespace. Clean up in dependency order: CollectionItem, then Collection, then
  RepositoryBranch/RepositoryTag, then Repository/Space/Bucket. RepositoryBranch and
  RepositoryTag have no mutable property, so any input change replaces them; Bucket likewise
  replaces on every change and deletes its files. Branch and tag need a repo that already has
  a commit (an empty repo may lack a main revision). CollectionItem needs a collection plus an
  existing item (for example a test Repository). Webhook needs a reachable https URL (a
  throwaway receiver such as webhook.site works) and watched must name a real user or repo;
  its secret is write-only. The getInferenceEndpoint lookup and the InferenceEndpoint resource
  are deferred because they cost money. Space builds are asynchronous, so do not assert on
  runtime stage; Hub reads can lag briefly after writes (retry before calling it drift).
  Update choices were read from the Go source: Repository Update applies private and gated
  (gated chosen because flipping private to public is risky), Space update handles variables,
  Collection patches title/description/private/theme, CollectionItem updates note, Webhook
  updates url/watched/domains/secret/disabled.
