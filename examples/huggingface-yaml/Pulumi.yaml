name: huggingface-yaml
runtime: yaml
description: Deploy a Hugging Face Inference Endpoint with Pulumi (YAML)

resources:
  # Deploy a zero-shot classification model
  classifier-endpoint:
    type: huggingface:index:InferenceEndpoint
    properties:
      modelRepository: cross-encoder/nli-deberta-v3-small
      modelFramework: pytorch
      modelTask: zero-shot-classification
      vendor: aws
      region: us-east-1
      accelerator: cpu
      instanceType: intel-icl
      instanceSize: x2
      minReplica: 1
      maxReplica: 2
      endpointType: authenticated

  # Create a model repository for fine-tuned checkpoints
  my-model-repo:
    type: huggingface:index:Repository
    properties:
      repoType: model
      private: true

outputs:
  endpointUrl: ${classifier-endpoint.url}
  endpointStatus: ${classifier-endpoint.status}
  modelRepoUrl: ${my-model-repo.url}
