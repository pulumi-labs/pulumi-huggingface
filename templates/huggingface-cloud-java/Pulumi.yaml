name: ${PROJECT}
description: ${DESCRIPTION}
runtime: java

template:
  description: A Java program to provision a Hugging Face model repository and a free-tier Gradio Space.
  config:
    namespace:
      description: Hugging Face username or organization that owns these resources. Leave blank to use the token owner's account.
      default: ""
    private:
      description: Whether the repository and Space are private (true or false).
      default: false
