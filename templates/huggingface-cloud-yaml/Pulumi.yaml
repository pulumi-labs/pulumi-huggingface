name: ${PROJECT}
description: ${DESCRIPTION}
runtime: yaml

template:
  description: A YAML program to provision a Hugging Face model repository and a free-tier Gradio Space.
  config:
    namespace:
      description: Hugging Face username or organization that owns these resources. Leave blank to use the token owner's account.
      default: ""
    private:
      description: Whether the repository and Space are private (true or false).
      default: false

config:
  namespace:
    type: string
    default: ""
  private:
    type: boolean
    default: false

resources:
  # Create a model repository on the Hugging Face Hub.
  # The repository stores model weights, config, and any other artifacts.
  hf-repo:
    type: huggingface:index:Repository
    properties:
      namespace: ${namespace}
      repoType: model
      private: ${private}

  # Create a Gradio Space on free cpu-basic hardware to showcase the model.
  # cpu-basic Spaces are free on the Hub and ideal for lightweight demos.
  hf-space:
    type: huggingface:index:Space
    properties:
      namespace: ${namespace}
      sdk: gradio
      hardware: cpu-basic
      private: ${private}

outputs:
  repoId:   ${hf-repo.repoId}
  repoUrl:  ${hf-repo.url}
  spaceId:  ${hf-space.spaceId}
  spaceUrl: ${hf-space.url}
