name: ${PROJECT}
description: ${DESCRIPTION}
runtime: python

template:
  description: "A Python program to deploy a Hugging Face Inference Endpoint with a Gradio Space that calls it: model serving plus a demo UI."
  config:
    hfToken:
      description: "Hugging Face API token with write access (starts with hf_...). Generate at https://huggingface.co/settings/tokens."
      secret: true
    namespace:
      description: Hugging Face username or organization that owns these resources. Leave blank to use the token owner's account.
      default: ""
    modelRepository:
      description: Hugging Face model repository ID to serve (e.g. mistralai/Mistral-7B-Instruct-v0.3).
      default: mistralai/Mistral-7B-Instruct-v0.3
    modelTask:
      description: Inference task type for the endpoint (e.g. text-generation).
      default: text-generation
    vendor:
      description: Cloud vendor for the inference endpoint (aws, azure, or gcp).
      default: aws
    region:
      description: Cloud region for the inference endpoint (e.g. us-east-1 for AWS).
      default: us-east-1
    instanceType:
      description: GPU instance family (e.g. nvidia-a10g).
      default: nvidia-a10g
    instanceSize:
      description: Instance size multiplier (x1, x2, x4, x8).
      default: x1
    endpointType:
      description: Access control for the endpoint (public, protected, or private).
      default: protected
